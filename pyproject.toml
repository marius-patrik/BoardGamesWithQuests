[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "chesswithquests"
dynamic = ["version"]
# The Git release tag is the version source of truth, including for Python builds.
description = "Game-neutral Python engine for JSON-configurable chess and checkers, powering an online React application."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "marius-patrik" }]
keywords = ["chess", "checkers", "board game", "engine", "json rules", "quests", "web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
# The currently integrated engine core has no third-party runtime imports. FastAPI and
# Supabase dependencies belong to packages/server once that package is implemented.
dependencies = []

[project.urls]
Homepage = "https://github.com/marius-patrik/BoardGamesWithQuests"
Documentation = "https://marius-patrik.github.io/BoardGamesWithQuests/"
"Architecture diagram" = "https://app.diagrams.net/#G19OY7iySOQWRAZDFKy1r-7tJKG_L-_Qn8#%7B%22pageId%22%3A%22C5RBs43oDa-KdzZeNtuy%22%7D"


[project.entry-points."boardgameswithquests.games"]
chess = "chess"
checkers = "checkers"

[tool.setuptools_scm]
# setuptools-scm reads Git tags directly; no manually maintained package version.

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]
include = ["engine*", "chess*", "checkers*"]

[tool.setuptools.package-data]
chess = ["config.json"]
checkers = ["config.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
)/
'''