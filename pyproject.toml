[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "boardgameswithquests"
dynamic = ["version"]
description = "Configurable Python/Tkinter board games with quests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "marius-patrik" }]
keywords = ["board games", "chess", "checkers", "tkinter", "quests"]
dependencies = []

[project.urls]
Homepage = "https://github.com/marius-patrik/BoardGamesWithQuests"
Documentation = "https://marius-patrik.github.io/BoardGamesWithQuests/"

[project.gui-scripts]
boardgameswithquests = "chesswithquests:main"

[tool.setuptools_scm]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["chesswithquests*", "controller*", "model*", "games*", "view*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = [".github/tests"]
pythonpath = ["src"]
markers = ["gui: requires a Tkinter display"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
