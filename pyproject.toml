[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "boardgameswithquests"
dynamic = ["version"]
description = "BoardGamesWithQuests Python server and reusable game engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "marius-patrik" }]
keywords = ["board games", "fastapi", "engine", "quests"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://github.com/marius-patrik/BoardGamesWithQuests"
Documentation = "https://marius-patrik.github.io/BoardGamesWithQuests/"

[tool.setuptools_scm]
# Tags are the package version source.

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]
include = ["server*"]
namespaces = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
