site_name: BoardGamesWithQuests
site_description: Source-derived documentation of the committed Python engine and repository governance
site_author: marius-patrik
repo_name: marius-patrik/BoardGamesWithQuests
repo_url: https://github.com/marius-patrik/BoardGamesWithQuests

# The build script reads tracked Markdown and Python from the repository root.
# Its temporary config and empty source directory are created outside the checkout.

theme:
  # Site-specific header over the shared first-party design. Kept outside the repository root.
  name: null
  custom_dir: .github/docs-ui

hooks:
  - .github/scripts/build_docs.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 2-4

plugins:
  - search
