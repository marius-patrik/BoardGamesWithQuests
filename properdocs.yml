site_name: ChessWithQuests
site_description: Chess game engine with quest mechanics and autogenerated API documentation
site_author: marius-patrik
repo_name: marius-patrik/ChessWithQuests
repo_url: https://github.com/marius-patrik/ChessWithQuests

# The build script reads tracked Markdown and Python from the repository root.
# Its temporary config and empty source directory are created outside the checkout.

theme:
  # The first-party theme shared by every repository on this pipeline, so the documentation of all
  # of them looks like one system and the version switcher works here too. Design system: shadcn/ui.
  name: null
  custom_dir: theme

hooks:
  - .github/scripts/docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 2-4

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: []
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 3
