name: Auto Format

on:
  push:
    branches: ["**"]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@953fd972834baf3b5a2ad2122890f55ea3679943
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "953fd972834baf3b5a2ad2122890f55ea3679943"
    secrets: inherit
