name: Auto Format

on:
  push:
    branches-ignore: [main, develop]

permissions:
  contents: write

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint an installation token for the App
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        continue-on-error: true
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}

      - name: Checkout repository source without replacing .darkfactory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python formatter
        if: hashFiles('**/*.py') != ''
        run: python -m pip install "black>=24.0.0"

      - name: Format Python
        if: hashFiles('**/*.py') != ''
        run: black .

      - name: Format Rust
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all

      - name: Format web sources
        if: hashFiles('package.json') != ''
        run: npm run --if-present format

      - name: Regenerate source-derived Mermaid architecture
        if: hashFiles('docs/architecture/diagrams/*.mmd') != ''
        run: |
          python scripts/generate_diagrams.py

      - name: Commit tracked formatting changes
        run: |
          git add -u -- . ':(exclude,attr:submodule)'
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ci): auto-format codebase"
          case "${{ github.ref_name }}" in
            main|develop)
              echo "::error::Auto Format must never push to protected branches"
              exit 1
              ;;
            *)
              git push origin "HEAD:${{ github.ref_name }}"
              ;;
          esac
