name: Auto Format

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint an installation token for the App
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}

      - name: Checkout repository source without replacing .darkfactory
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python formatter
        if: hashFiles('**/*.py') != ''
        run: python -m pip install "black>=24.0.0"

      - name: Format Python
        if: hashFiles('**/*.py') != ''
        run: black .

      - name: Format Rust
        if: hashFiles('packages/native/src-tauri/Cargo.toml') != ''
        run: cargo fmt --manifest-path packages/native/src-tauri/Cargo.toml --all

      - name: Set up Bun for owned UI packages
        if: hashFiles('packages/client/package.json', 'packages/native/package.json') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Format Bun app sources and generate reproducible locks
        if: hashFiles('packages/client/package.json', 'packages/native/package.json') != ''
        run: |
          set -euo pipefail
          for pkg in packages/client packages/native; do
            if [ -f "$pkg/package.json" ]; then
              (
                cd "$pkg"
                bun install
                bunx biome check --write .
              )
            fi
          done

      - name: Format web sources
        if: hashFiles('package.json') != ''
        run: npm run --if-present format

      - name: Commit tracked formatting changes
        run: |
          git add -u -- . ':(exclude,attr:submodule)'
          for lockfile in packages/client/bun.lock packages/native/bun.lock; do
            if [ -f "$lockfile" ]; then git add -- "$lockfile"; fi
          done
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ci): auto-format codebase"
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Default branch; direct push skipped to comply with protection."
          fi
