name: Review Board Behavior (Temporary)

on:
  push:
    branches: [feature/board-generalisation]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the actual package
        run: python -m pip install -e .
      - name: Review board geometry, state safety and serialization
        run: |
          python - <<'PY'
          from engine.model.game.board import Board
          from engine.model.game.move import Move
          from engine.model.game.validator import MoveValidator
          from engine.model.misc.export_writers import ChessNotationWriter
          from engine.model.pieces.rook import Rook
          from engine.model.pieces.pawn import Pawn
          from engine.model.pieces.queen import Queen

          def rejects(call, kind):
              try:
                  call()
              except kind:
                  return
              raise AssertionError(f"Expected {kind.__name__}: {call}")

          for dimensions in ((0, 8), (-1, 8), (True, 8), (8, 0)):
              rejects(lambda dimensions=dimensions: Board(dimensions), ValueError)
          rejects(lambda: Board((10, 10)), ValueError)
          board = Board((10, 10), setup_pieces=False)
          rook = Rook(1)
          board.apply_placement([((0, 9), rook)])
          rejects(lambda: board.apply_placement([((0, 9), rook), ((0, 9), Rook(-1))]), ValueError)
          assert board.get_piece_at((0, 9)) is rook  # atomic validation
          rejects(lambda: board.apply_placement([((10, 9), Rook(-1))]), ValueError)
          assert board.get_piece_at((0, 9)) is rook
          rejects(lambda: board.set_piece_at((-1, 9), None), IndexError)
          assert not board.move_piece((0, 9), (0, 9))
          assert board.get_piece_at((0, 9)) is rook
          assert not Move((0, 9), (0, 10)).validate(board)
          assert Move((0, 9), (0, 0)).validate(board)
          assert not Move((0, 9), (0, 0)).validate()
          validator = MoveValidator(board)
          assert validator.is_valid_move(Move((0, 9), (0, 0)), board)
          assert (9, 9) in validator.get_pseudo_legal_moves((0, 9), board)
          assert validator.is_square_attacked((0, 0), 1, board)
          assert not validator.is_square_attacked((0, 10), 1, board)
          assert ChessNotationWriter().to_fen(board).endswith("9R w - - 0 1")
          wrong = Move((0, 9), (10, 10))
          assert not wrong.execute(board)
          assert wrong.piece is None and wrong.captured_piece is None
          assert board.get_piece_at((0, 9)) is rook
          board.set_piece_at((0, 0), Rook(1))
          assert not board.move_piece((0, 9), (0, 0))
          assert board.get_piece_at((0, 9)) is rook

          small = Board((5, 7), setup_pieces=False)
          pawn = Pawn(1)
          small.apply_placement([((0, 2), pawn)])
          promote = Move((0, 2), (1, 2), promotion_piece=Queen(1))
          assert promote.execute(small)
          assert small.get_piece_at((0, 2)) is None
          assert isinstance(small.get_piece_at((1, 2)), Queen)
          assert promote.piece is pawn

          standard = Board()
          assert standard.rows == standard.cols == 8
          assert standard.get_piece_at((0, 0)).getType() == "rook"
          assert standard.get_piece_at((7, 4)).getType() == "king"
          print("Ad hoc board review passed on 5x7, 8x8 and 10x10.")
          PY
