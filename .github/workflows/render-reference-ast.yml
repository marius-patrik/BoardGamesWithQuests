# AST.mmd is the canonical source. A committed SVG is its reviewable render.
# The renderer is deliberately finite and checks every Mermaid node/edge.
name: Render Reference AST
on:
  push:
    branches-ignore: [main]
    paths:
      - '.agents/notes/requirements/AST.mmd'
      - '.github/scripts/render_reference_ast.py'
      - '.github/workflows/render-reference-ast.yml'
  pull_request:
    paths:
      - '.agents/notes/requirements/AST.mmd'
      - '.agents/notes/requirements/diagrams/reference_AST.svg'
      - '.github/scripts/render_reference_ast.py'
      - '.github/workflows/render-reference-ast.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Verify existing reference on pull request
        if: github.event_name == 'pull_request'
        run: python .github/scripts/render_reference_ast.py --check
      - name: Install graph layout tool
        if: github.event_name != 'pull_request'
        run: sudo apt-get update -qq && sudo apt-get install -y graphviz
      - name: Regenerate reference AST SVG
        if: github.event_name != 'pull_request'
        run: python .github/scripts/render_reference_ast.py
      - name: Commit changed generated reference to topic branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .agents/notes/requirements/diagrams/reference_AST.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/notes/requirements/diagrams/reference_AST.svg
          git commit -m 'docs(ast): regenerate Mermaid reference SVG'
          git push origin "HEAD:$BRANCH"
