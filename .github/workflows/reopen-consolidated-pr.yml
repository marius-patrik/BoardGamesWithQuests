name: Reopen consolidated PR under DarkFactory App
on:
  push:
    branches: [feature/product-integration]
    paths: [.github/workflows/reopen-consolidated-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  reopen-as-bot:
    if: github.repository == 'marius-patrik/BoardGamesWithQuests'
    runs-on: ubuntu-latest
    steps:
      - name: Mint DarkFactory App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
      - name: Replace owner-authored PR without merging
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr=267
          author="$(gh api "repos/$REPO/pulls/$pr" --jq '.user.login')"
          state="$(gh api "repos/$REPO/pulls/$pr" --jq '.state')"
          if [[ "$author" != "marius-patrik" || "$state" != "open" ]]; then
            echo "::error::Expected original open owner-authored draft #267; got $author/$state"
            exit 1
          fi
          printf '%s\n' "Updating original user-authored draft PR into a closed supersession reference."
          gh api -X PATCH "repos/$REPO/pulls/$pr" -f state=closed > /dev/null
          printf '%s\n' "Creating replacement draft with DarkFactory App identity."
          if ! gh api -X POST "repos/$REPO/pulls" \
            -f head='feature/product-integration' -f base=main \
            -f title='feat: consolidate final JSON-driven web game implementation' \
            -f draft=true \
            -f body='Closes #129. Complete implementation is **not** present. Current [PLAN.md](https://github.com/marius-patrik/BoardGamesWithQuests/blob/feature/product-integration/.agents/notes/PLAN.md) and PRD define the work. This App-authored draft replaces historical owner-authored PR #267 and the 25 closed historical stack PRs. Source history is preserved but only corrected foundation and unverified game-owned candidates are present. JSON-only rule/quest definitions, Python FastAPI/Vercel, React/Rsbuild/Bun, Supabase guests/Auth/Postgres/Realtime, Tauri web wrapper, GPL-3.0, FEN export only. Final behavior tests #239, docs, deployments and independent review remain required. Do not approve or merge until all gates pass.' \
            --jq '{number,html_url,user:.user.login,draft,state}' ; then
            echo "::error::Replacement failed; reopening old PR #267"
            gh api -X PATCH "repos/$REPO/pulls/$pr" -f state=open > /dev/null
            exit 1
          fi
