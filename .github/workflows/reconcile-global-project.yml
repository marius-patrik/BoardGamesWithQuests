name: G0 Project Status Reconciliation
on:
  push:
    branches: [feature/product-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(projects): rerun') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-integration
      - name: Verify project-scoped credentials exist
        run: test -n "${GH_TOKEN:-}"
      - name: Reconcile project 14 from actual GitHub closure evidence
        run: python .github/scripts/reconcile_project14.py
