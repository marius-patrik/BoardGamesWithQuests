name: Verify and Deploy Supabase

on:
  pull_request:
    paths:
      - "packages/server/supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches: [main]
    paths:
      - "packages/server/supabase/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply approved migrations to the linked hosted project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Start isolated local Supabase project and apply migrations
        run: |
          supabase start
          supabase db reset --local
      - name: Ensure private schema exists
        run: supabase db lint --local

  deploy-hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    needs: verify-local
    runs-on: ubuntu-latest
    environment: supabase-production
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Link reviewed hosted database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref fizmsbiehxddjewtkenr --password "$SUPABASE_DB_PASSWORD"
      - name: Apply reviewed migrations (no reset)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes
