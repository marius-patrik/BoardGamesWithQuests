name: Reopen governance review through GitHub App
on:
  push:
    branches:
      - chore/template-alignment-preserve-darkfactory
    paths:
      - .github/workflows/bot-reopen-409.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  create-bot-pr:
    if: github.repository == 'marius-patrik/BoardGamesWithQuests' && github.ref == 'refs/heads/chore/template-alignment-preserve-darkfactory'
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint reviewable author token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Create bot-authored replacement, never silently modify old PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/pulls/413" --jq .state)" = closed
          if gh pr list --repo "$GH_REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "A replacement PR already exists; refusing duplicate."
            exit 0
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          Closes #409

          ## Scope
          Native template-repo governance alignment based directly on `main`, preserving `.darkfactory/` and the installed DarkFactory PrideVer workflow.

          ## Changes
          - Modular canonical requirements, decisions, notes and rules with deterministic README, PRD, ARCHITECTURE and AGENTS projections.
          - Repository-local roles/skills, native workflows, central test ownership, original reference assets and source-derived Mermaid diagrams.
          - Restored built-documentation interaction, artwork, link/navigation and source contract verification; native branch protection administrator tooling.
          - Removed superseded project-status narratives and future implementation contracts; desired behavior remains in linked issues.

          ## Explicitly excluded
          No application feature implementation, `.darkfactory` submodule conversion, `repo.dfconfig` version-authority migration, release branch cutover, production deployment or merge.

          ## Verification
          This PR remains **DRAFT** until generated-source, Mermaid, full documentation preview, Chromium, DarkFactory and relevant behavioral checks pass against the exact reviewed SHA. Any unavailable provider check is BLOCKED rather than passed.

          ## Previous review
          Replacement for owner-authored PR #413, closed without merge so the maintainer can review a PR created by the configured GitHub App.
          BODY
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --draft \
            --title "refactor(governance): align with template except DarkFactory" \
            --body-file "$RUNNER_TEMP/pr-body.md"
