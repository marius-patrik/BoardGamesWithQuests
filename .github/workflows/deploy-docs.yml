name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages is deployed from reviewed main through its Actions deployment
# API; the retired preview-docs caller and gh-pages staging are not inputs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-actions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build current docs from tracked repository sources
        run: python .github/scripts/build_docs.py

      - name: Write manifest of actual deployed versions/projects
        run: python .github/scripts/docs_manifest.py --site site

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages from Actions
        id: deployment
        uses: actions/deploy-pages@v4
