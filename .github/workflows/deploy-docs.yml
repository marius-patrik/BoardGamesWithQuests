name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages is deployed from reviewed main through its Actions deployment
# Docs are published exclusively from tracked source through Actions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-actions
  cancel-in-progress: false

