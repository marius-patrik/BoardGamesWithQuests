name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkfactory-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Check out pinned DarkFactory runtime
        if: github.repository != 'marius-patrik/DarkFactory'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: "marius-patrik/DarkFactory"
          ref: "12a2507ba6499b3236c17d3c977c55a480ed5200"
          path: .darkfactory-runtime

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install DarkFactory runtime
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun install --frozen-lockfile --cwd "$ROOT"

      - name: Resolve detected quality matrix
        id: matrix
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun "$ROOT/packages/cli/src/bin.ts" ci matrix             --repo "$GITHUB_WORKSPACE"             --capabilities-root "$ROOT/.darkfactory/plugins" > "$RUNNER_TEMP/darkfactory-quality.json"
          jq -c '.matrix' "$RUNNER_TEMP/darkfactory-quality.json"             | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          python3 .github/scripts/verify_quality_gate.py --plan "$RUNNER_TEMP/darkfactory-quality.json"
          jq -r '.gaps[] | "Additional product verification gap: \(.packageId) \(.kind): \(.reason // .description)"' "$RUNNER_TEMP/darkfactory-quality.json"

      - name: Preserve validated quality discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-plan
          path: ${{ runner.temp }}/darkfactory-quality.json
          if-no-files-found: error

  quality-run:
    name: ${{ matrix.id }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Bun
        # Ensure repository script entrypoints can run under Bun.
        if: matrix.packageManager == 'bun' || matrix.ecosystem == 'typst'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Set up Node
        if: matrix.ecosystem == 'node' && matrix.packageManager != 'bun'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Enable Corepack
        if: matrix.packageManager == 'pnpm' || matrix.packageManager == 'yarn'
        run: corepack enable

      - name: Set up Python
        if: matrix.ecosystem == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.version || '3.13' }}

      - name: Install Python package manager
        if: matrix.packageManager == 'uv' || matrix.packageManager == 'poetry' || matrix.packageManager == 'pipenv'
        env:
          DF_PACKAGE_MANAGER: ${{ matrix.packageManager }}
        run: python -m pip install "$DF_PACKAGE_MANAGER"

      - name: Set up Rust
        if: matrix.ecosystem == 'rust'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Tauri Linux native build prerequisites
        if: matrix.ecosystem == 'rust' && matrix.cwd == 'packages/desktop/src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - name: Set up Go
        if: matrix.ecosystem == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable

      - name: Set up Deno
        if: matrix.ecosystem == 'deno'
        # Pin to a verified immutable action version.
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Set up Typst
        # Provide Typst to manuscript compilation jobs.
        if: matrix.ecosystem == 'typst' || matrix.cwd == 'paper'
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108

      - name: Set up Lean
        if: matrix.ecosystem == 'lean'
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          build: false
          test: false

      - name: Set up TeX Live
        if: matrix.ecosystem == 'latex'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Install package dependencies
        if: matrix.setupCommand != ''
        env:
          DF_SETUP_COMMAND: ${{ matrix.setupCommand }}
          DF_SETUP_CWD: ${{ matrix.setupCwd }}
        run: |
          cd "$GITHUB_WORKSPACE/$DF_SETUP_CWD"
          bash -lc "$DF_SETUP_COMMAND"

      - name: Install repository Python verification dependencies
        if: matrix.ecosystem == 'python'
        run: python -m pip install -e . -r requirements-dev.txt

      - name: Install source documentation rendering prerequisite
        if: matrix.ecosystem == 'python'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Run detected quality action
        env:
          DF_ACTION_COMMAND: ${{ matrix.command }}
          DF_ACTION_CWD: ${{ matrix.cwd }}
          DF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          cd "$GITHUB_WORKSPACE/$DF_ACTION_CWD"
          export PATH="$PWD/node_modules/.bin:$PATH"
          if [[ "$DF_ACTION_COMMAND" == "pytest" || "$DF_ACTION_COMMAND" == "pytest -q" ]]; then
            test -d "$GITHUB_WORKSPACE/tests"
            python -m pytest -q "$GITHUB_WORKSPACE/tests"
            PYTHONPATH="$GITHUB_WORKSPACE/packages" python "$GITHUB_WORKSPACE/scripts/probe_json_contract.py"
            PYTHONPATH="$GITHUB_WORKSPACE/packages" python "$GITHUB_WORKSPACE/scripts/probe_g1_semantics.py"
          else
            if [[ "$DF_ACTION_COMMAND" == black\ --check* ]]; then
              black --check --diff --line-length 100 .
            else
              bash -lc "$DF_ACTION_COMMAND"
            fi
          fi

      - name: Record detected action execution
        if: always()
        env:
          QUALITY_ACTION_ID: ${{ matrix.id }}
          QUALITY_JOB_RESULT: ${{ job.status }}
        run: python3 .github/scripts/verify_quality_gate.py --record "$RUNNER_TEMP/result.json" --id "$QUALITY_ACTION_ID" --result "$QUALITY_JOB_RESULT"
      - name: Preserve detected action execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install frontend dependencies
        working-directory: packages/web
        run: bun install --frozen-lockfile
      - name: Build actual production web bundle
        working-directory: packages/web
        run: bun run build
      - name: Verify generated web entry
        run: test -s packages/web/dist/index.html

  hosted-bootstrap:
    name: hosted-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Verify publicly reachable Python and web bootstrap
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 1 --max-time 25 \
            https://boardgameswithquests-api.vercel.app/health > "$RUNNER_TEMP/health.json"
          jq -e '.status == "bootstrap" and .playable == false' "$RUNNER_TEMP/health.json"
          curl -fsSL --retry 3 --retry-delay 1 --max-time 25 \
            https://boardgameswithquests-api.vercel.app/games > "$RUNNER_TEMP/games.json"
          jq -e '(.games | length) == 3 and (.games | all(.playable == false))' "$RUNNER_TEMP/games.json"
          curl -fsSL --retry 3 --retry-delay 1 --max-time 25 \
            https://boardgameswithquests-web.vercel.app/ > "$RUNNER_TEMP/index.html"
          grep -Fq 'BoardGamesWithQuests' "$RUNNER_TEMP/index.html"

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project documentation dependencies
        run: python -m pip install -r requirements-dev.txt
      # Build documentation generated from source docstrings and preserve reference assets.
      - name: Build and verify project-specific documentation
        run: |
          python .github/scripts/build_docs.py
          python .github/scripts/docs_manifest.py --site site

  quality:
    name: quality
    if: always()
    needs: [detect, quality-run, docs-check, web-build, hosted-bootstrap]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download same-run quality evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: quality-*
          path: quality-evidence
      - name: Enforce discovered and executed quality actions
        env:
          QUALITY_DETECT: ${{ needs.detect.result }}
          QUALITY_ACTIONS: ${{ needs.quality-run.result }}
          QUALITY_DOCS: ${{ needs.docs-check.result }}
          QUALITY_WEB: ${{ needs.web-build.result }}
          QUALITY_HOSTED: ${{ needs.hosted-bootstrap.result }}
        run: |
          for result in "$QUALITY_DETECT" "$QUALITY_ACTIONS" "$QUALITY_DOCS" "$QUALITY_WEB" "$QUALITY_HOSTED"; do
            test "$result" = "success"
          done
          python3 .github/scripts/verify_quality_gate.py --plan quality-evidence/quality-plan/darkfactory-quality.json --results quality-evidence

  python-status:
    name: pipeline / pipeline (${{ matrix.python }})
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Publish protected Python behavior status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = "success"

  subsystem-status:
    name: pipeline / ${{ matrix.subsystem }}
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subsystem: [rust, web, docs]
    steps:
      - name: Publish protected subsystem quality status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = "success"
