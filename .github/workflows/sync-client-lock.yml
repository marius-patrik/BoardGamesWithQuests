name: Sync Client Lockfile
on:
  push:
    branches: [feat/server-web-native-bootstrap]
    paths: [.github/workflows/sync-client-lock.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Rebuild lock and commit directly to platform branch
        run: |
          set -euo pipefail
          cd packages/client
          bun install
          cd ../..
          git add packages/client/bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(client): lock Wouter dependency"
            git push origin HEAD:feat/server-web-native-bootstrap
          fi
