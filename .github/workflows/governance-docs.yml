name: Generated governance sources
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify source-derived diagrams match the checked-out code
        run: |
          python .github/scripts/generate_diagrams.py
          git diff --exit-code -- docs/architecture/diagrams/

