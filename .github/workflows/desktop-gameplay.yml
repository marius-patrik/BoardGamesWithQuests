name: Desktop JSON Gameplay Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    name: local-session / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install desktop and pytest
        run: python -m pip install -e . pytest
      - name: Exercise authoritative desktop session
        run: python -m pytest -q .github/tests/test_desktop_json_gameplay.py

  gui:
    name: real-tkinter / Python 3.12
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install real Tkinter and virtual X11 display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth
          python -m pip install -e . pytest
      - name: Exercise the actual board, modal and settings widgets
        run: xvfb-run -a python -m pytest -q .github/tests/desktop_gui_acceptance.py
