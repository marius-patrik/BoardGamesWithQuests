name: Signed iOS Release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    if: vars.ENABLE_SIGNED_IOS_RELEASE == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: macos-latest
    environment: native-ios-signing
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release and required signing credentials
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_MOBILE_PROVISION"
          test -n "$APPLE_DEVELOPMENT_TEAM"
          tag="${REQUESTED_TAG:-$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)}"
          test -n "$tag"
          test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
          gh release view "$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install iOS build tools
        run: brew install cocoapods
      - name: Build signed device IPA
        working-directory: packages/native
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          bun install
          bun run icon
          bun -e 'const p="src-tauri/tauri.conf.json"; const v=await Bun.file(p).json(); v.version=process.env.RELEASE_TAG.slice(1); await Bun.write(p, JSON.stringify(v,null,2)+"\n")'
          bun tauri ios init --ci
          bun tauri ios build --ci --export-method app-store-connect
      - name: Attach signed IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ipa="$(find packages/native/src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          gh release upload "$TAG" "$ipa" --clobber
