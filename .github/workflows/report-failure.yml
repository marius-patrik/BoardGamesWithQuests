name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@953fd972834baf3b5a2ad2122890f55ea3679943
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "953fd972834baf3b5a2ad2122890f55ea3679943"
    secrets: inherit
