name: Report Pipeline Failure

on:
  workflow_run:
    workflows:
      - DarkFactory Runtime
      - Deploy Documentation
      - Open Pull Request
      - Project Board Automation
      - Release
      - Run Autonomous Agent
      - Verify Docs Layout
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    if: github.event.workflow_run.head_branch == github.event.repository.default_branch
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@368eb9d75d5d828e7ac17fe590d4dc17b028cebc
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "368eb9d75d5d828e7ac17fe590d4dc17b028cebc"
    secrets: inherit
