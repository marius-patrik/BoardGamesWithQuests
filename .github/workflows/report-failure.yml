name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@69255458b9b313494610d627265be0b408d6c1c1
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "69255458b9b313494610d627265be0b408d6c1c1"
    secrets: inherit
