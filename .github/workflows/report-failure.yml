name: Report Pipeline Failure

on:
  workflow_run:
    workflows:
      - DarkFactory Runtime
      - Deploy Documentation
      - Open Pull Request
      - Project Board Automation
      - Release
      - Run Autonomous Agent
      - Verify Docs Layout
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    if: github.event.workflow_run.head_branch == 'development' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@4a922f5be5ec3d928f9142424674b433e0f40b71
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4a922f5be5ec3d928f9142424674b433e0f40b71"
    secrets: inherit
