name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@12a2507ba6499b3236c17d3c977c55a480ed5200
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "12a2507ba6499b3236c17d3c977c55a480ed5200"
    secrets: inherit
