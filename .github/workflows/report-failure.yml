name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@b5bdba739bf989f965af51c9efd88ee89617075c
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "b5bdba739bf989f965af51c9efd88ee89617075c"
    secrets: inherit
