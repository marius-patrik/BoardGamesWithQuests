name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@368eb9d75d5d828e7ac17fe590d4dc17b028cebc
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "368eb9d75d5d828e7ac17fe590d4dc17b028cebc"
    secrets: inherit
