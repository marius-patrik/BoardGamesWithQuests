name: One-time Global Project PR Link
on:
  push:
    branches: [feature/product-integration]
    paths: [.github/workflows/attach-consolidated-pr-global.yml]
permissions:
  contents: read
jobs:
  attach:
    if: github.repository == 'marius-patrik/BoardGamesWithQuests'
    runs-on: ubuntu-latest
    steps:
      - name: Register the sole active PR in Global project
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh project view 17 --owner marius-patrik --format json --jq '{title,id,number}'
          gh project item-add 17 --owner marius-patrik --url 'https://github.com/marius-patrik/BoardGamesWithQuests/pull/271' --format json | jq -c '{id,title}'
