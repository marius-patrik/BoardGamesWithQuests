name: Verify Bound Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bound-issue:
    name: verify / verify-bound-issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Check out pinned DarkFactory runtime
        if: github.repository != 'marius-patrik/DarkFactory'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: "marius-patrik/DarkFactory"
          ref: "368eb9d75d5d828e7ac17fe590d4dc17b028cebc"
          path: .darkfactory-runtime

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install DarkFactory runtime
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun install --frozen-lockfile --cwd "$ROOT"

      # Issue binding is verified by the pinned shared runtime.
      - name: Verify PR description binds a tracking issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun "$ROOT/packages/harness/src/ci/bound-issue.ts"
