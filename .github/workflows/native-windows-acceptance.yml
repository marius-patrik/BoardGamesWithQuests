name: Native Windows desktop acceptance

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-external-gui:
    name: windows-external-gui
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install source and native automation dependencies
        run: python -m pip install -e . pyinstaller pyautogui pillow
      - name: Build actual standalone Windows GUI application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BoardGamesWithQuests src/main.py
      - name: Exercise external Windows keyboard, pointer, capture XP and persistence
        run: python .github/tests/windows_native_acceptance.py --exe dist/BoardGamesWithQuests.exe --evidence native-evidence
      - name: Upload actual screen and storage evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-external-gui-evidence
          path: native-evidence/
          if-no-files-found: warn
      - name: Upload standalone Windows executable for clean-host inspection
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boardgameswithquests-windows-x64
          path: dist/BoardGamesWithQuests.exe
          if-no-files-found: error

  linux-tkinter-gui:
    name: linux-tkinter-gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install source and Tk/Xvfb
        run: |
          python -m pip install -e . pytest python-xlib
          if ! command -v xvfb-run >/dev/null || ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Execute actual Tkinter interactions
        run: xvfb-run -a python -m pytest -q .github/tests/test_gui.py
