name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && (github.event_name != 'pull_request_target' || (github.event.pull_request.head.ref == 'chore/479-sync-upstream-main' && github.event.pull_request.head.sha == '3bc11ca3621ca5d497aff3bab071ac6d222dadcc'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'develop' || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up documentation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-dev.txt


      - name: Verify documentation publication behavior
        run: |
          python -m pytest -q .github/tests/test_docs_publication.py
          if [ -f .github/tests/test_docs_artifacts.py ]; then
            python -m pytest -q .github/tests/test_docs_artifacts.py
          fi

      - name: Install pinned Mermaid compiler
        run: npm install --global --no-fund --no-audit @mermaid-js/mermaid-cli@11.16.0

      - name: Build documentation from PR source
        run: |
          python .github/scripts/build_docs.py
          test -f site/index.html
          touch site/.nojekyll

      - name: Test the published documentation artifact
        run: python -m pytest -q .github/tests/docs_site_acceptance.py

      - name: Exercise published controls in Chromium
        run: node .github/tests/test_docs_browser.mjs

      - name: Record exact PR head for publisher validation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf '%s\n' "$HEAD_SHA" > site/.preview-head

      - name: Upload passing PR site
        if: github.event_name != 'pull_request_target'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-preview-${{ github.event.pull_request.number }}
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  closed:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trusted publisher to remove closed preview
        run: echo "The publisher retains only open PRs."
