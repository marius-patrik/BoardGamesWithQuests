name: Preview Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up documentation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate normative API and database contracts
        run: python .github/scripts/check_spec_contracts.py

      - name: Validate Prisma schema with pinned Prisma 7 CLI
        run: |
          npm install --global --no-fund --no-audit prisma@7.10.0
          prisma validate --schema=packages/server/supabase/schema.prisma

      - name: Verify documentation publication behavior
        run: |
          python -m pytest -q .github/tests/test_docs_publication.py
          if [ -f .github/tests/test_docs_artifacts.py ]; then
            python -m pytest -q .github/tests/test_docs_artifacts.py
          fi

      - name: Install pinned Mermaid compiler
        run: npm install --global --no-fund --no-audit @mermaid-js/mermaid-cli@11.16.0

      - name: Build documentation from PR source
        run: |
          python .github/scripts/build_docs.py
          test -f site/index.html
          touch site/.nojekyll

      - name: Record exact PR head for publisher validation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf '%s\n' "$HEAD_SHA" > site/.preview-head

      - name: Upload passing PR site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-preview-${{ github.event.pull_request.number }}
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  closed:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trusted publisher to remove closed preview
        run: echo "The publisher retains only open PRs."
