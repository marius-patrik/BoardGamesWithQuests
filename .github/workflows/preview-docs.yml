name: Preview Documentation

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview-docs:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@953fd972834baf3b5a2ad2122890f55ea3679943
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "953fd972834baf3b5a2ad2122890f55ea3679943"
    secrets: inherit
