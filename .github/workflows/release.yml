name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - repo.dfconfig
      - .github/tests/test_release_gate.py
      - .github/scripts/release_gate.py
  workflow_dispatch:
    inputs:
      bump:
        description: "Optional PrideVer bump or exact version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  verify-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify fail-closed release authorization
        run: python3 -m unittest discover -s .github/tests -p test_release_gate.py

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'marius-patrik/BoardGamesWithQuests'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify this release targets the live main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          python3 .github/scripts/release_gate.py release \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" --run-sha "$GITHUB_SHA" \
            --live-sha "$live_main" --checkout-sha "$(git rev-parse HEAD)"

      - name: Checkout pinned DarkFactory release authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: marius-patrik/DarkFactory
          ref: 368eb9d75d5d828e7ac17fe590d4dc17b028cebc
          path: .darkfactory-pipeline
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install DarkFactory release runtime
        run: bun install --frozen-lockfile --cwd .darkfactory-pipeline

      - name: Resolve version, assets and release notes
        id: resolve
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$REQUESTED_BUMP" ]; then args=(--bump "$REQUESTED_BUMP"); fi
          bun .darkfactory-pipeline/packages/harness/src/release/cli.ts \
            --repo-root "$GITHUB_WORKSPACE" --notes-out "$RUNNER_TEMP/release-notes.md" \
            "${args[@]}" > "$RUNNER_TEMP/release.json"
          if [ "$(jq -r '.tag // empty' "$RUNNER_TEMP/release.json")" = "" ] && \
             [ -z "$REQUESTED_BUMP" ] && [ -z "$(git tag --points-at HEAD)" ]; then
            bun .darkfactory-pipeline/packages/harness/src/release/cli.ts \
              --repo-root "$GITHUB_WORKSPACE" --bump patch \
              --notes-out "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release.json"
          fi
          if [ "$(jq '.metadata_problems | length' "$RUNNER_TEMP/release.json")" -ne 0 ]; then
            jq -r '.metadata_problems[]' "$RUNNER_TEMP/release.json" >&2
            exit 1
          fi
          echo "tag=$(jq -r '.tag // empty' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
          jq '{version,tag,mode,metadata_problems,steps}' "$RUNNER_TEMP/release.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release for verified main commit
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          tag_gate=(--tag "$TAG" --run-sha "$GITHUB_SHA")
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_gate+=(--assigned-sha "$(git rev-list -n 1 "$TAG")")
          fi
          python3 .github/scripts/release_gate.py tag "${tag_gate[@]}"
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          python3 .github/scripts/release_gate.py release \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" --run-sha "$GITHUB_SHA" \
            --live-sha "$live_main" --checkout-sha "$(git rev-parse HEAD)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
