name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@953fd972834baf3b5a2ad2122890f55ea3679943
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "953fd972834baf3b5a2ad2122890f55ea3679943"
    secrets: inherit
