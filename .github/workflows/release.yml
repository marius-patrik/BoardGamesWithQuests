name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Optional explicit PrideVer bump: patch, minor, major, proud or version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      fallback_bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: marius-patrik/DarkFactory
          ref: b5bdba739bf989f965af51c9efd88ee89617075c
          path: .darkfactory
      - id: resolve
        name: Ensure every untagged main change creates a development release
        run: |
          PYTHONPATH=.darkfactory/.github/scripts python - <<'PY' >> "$GITHUB_OUTPUT"
          import subprocess
          import versioning

          decision = versioning.resolve(".")
          tag = versioning.latest_tag(versioning.git_tags("."))
          untagged = subprocess.check_output(
              ["git", "rev-list", "--count", f"{tag}..HEAD" if tag else "HEAD"],
              text=True,
          ).strip()
          # Preserve normal Conventional Commit classification (feat -> minor,
          # fix -> patch). Docs/chore commits otherwise silently create no release.
          # No untagged commits means rerunning the workflow remains idempotent.
          print("bump=patch" if int(untagged) and not decision["next"] else "bump=")
          PY

  release:
    needs: resolve
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@b5bdba739bf989f965af51c9efd88ee89617075c
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "b5bdba739bf989f965af51c9efd88ee89617075c"
      bump: ${{ inputs.bump || needs.resolve.outputs.fallback_bump }}
    secrets: inherit
