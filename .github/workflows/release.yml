name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@69255458b9b313494610d627265be0b408d6c1c1
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "69255458b9b313494610d627265be0b408d6c1c1"
    secrets: inherit
