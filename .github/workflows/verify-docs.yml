name: Verify Docs Layout

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Verify repository-wide virtual documentation
        run: |
          python .github/scripts/build_docs.py
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          assert (root / "site/index.html").is_file()
          assert (root / "site/model/game/board/index.html").is_file()
          assert not (root / ".docs").exists(), "documentation source folder must not exist"
          print("Repository-wide documentation verified.")
          PY

