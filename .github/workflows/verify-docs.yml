name: Verify Docs Layout

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Syntax validation while test suite is being rebuilt (issue 239)
        run: python -m compileall -q packages

      - name: Verify normative API, schema, data and source architecture
        run: |
          python .github/scripts/check_spec_contracts.py
          python - <<'PY'
          from pathlib import Path
          import ast
          source=Path('.github/scripts/docs_hooks.py').read_text(encoding='utf-8')
          ast.parse(source)
          assert 'data-mermaid-viewer' in source
          assert Path('.agents/notes/requirements/AST.mmd').exists()
          assert not Path('.agents/notes/requirements/diagrams/reference_AST.svg').exists()
          PY

      - name: Verify repository-wide virtual documentation
        run: |
          python .github/scripts/build_docs.py
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          assert (root / "site/index.html").is_file()
          homepage = (root / "site/index.html").read_text()
          assert 'data-switcher-projects' in homepage
          assert 'data-switcher-versions' in homepage
          assert 'data-switcher-versions-group' in homepage
          assert (root / "site/assets/theme.css").is_file()
          assert not (root / "theme").exists(), "theme assets now live under .github/docs-ui"
          assert (root / ".github/docs-ui/main.html").is_file()
          import subprocess
          subprocess.run(["python", ".github/scripts/docs_manifest.py", "--site", "site"], check=True)
          import json
          manifest = json.loads((root / "site/versions.json").read_text())
          assert manifest["versions"][0] == {"name": "main", "path": ""}
          assert any(p["name"] == "BoardGamesWithQuests" for p in manifest["projects"])
          assert (root / "site/engine/model/game/board/index.html").is_file()
          assert (root / "site/agents/notes/diagrams/reference-page1.svg").is_file()
          assert (root / "site/agents/notes/diagrams/implementation-classes.svg").is_file()
          # Prevent replacing real UML connectivity with a flat inventory SVG.
          for diagram, min_edges in (("implementation.svg", 2), ("implementation-classes.svg", 5)):
              svg = (root / "site/agents/notes/diagrams" / diagram).read_text()
              assert svg.count('class="node"') >= 3, f"{diagram}: missing UML boxes"
              assert svg.count('class="edge"') >= min_edges, f"{diagram}: no graph relationships"
          assert (root / ".agents/AGENTS.md").is_file() and not (root / ".agents/AGENTS.md").is_symlink()
          assert (root / ".agents/notes/PRD.md").is_file()
          assert (root / ".agents/notes/GUI_mockup.svg").is_file()
          assert not (root / ".agents/notes/diagrams/reference.drawio").exists()
          assert (root / "CONTRIBUTING.md").is_symlink()
          assert (root / "CONTRIBUTING.md").resolve() == (root / ".agents/AGENTS.md").resolve()
          assert (root / ".agents/SCRATCHPAD.md").is_file()
          for retired in ("AGENTS.md", "CLAUDE.md", ".claude", "PRD.md", "SCRATCHPAD.md", "GUI_mockup.svg", "notes"):
              assert not (root / retired).exists() and not (root / retired).is_symlink(), retired
          for retired in (".agents/CLAUDE.md",):
              assert not (root / retired).exists() and not (root / retired).is_symlink(), retired
          assert not (root / ".docs").exists(), "documentation source folder must not exist"
          print("Repository-wide documentation verified.")
          PY

