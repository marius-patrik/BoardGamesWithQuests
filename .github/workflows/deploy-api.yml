name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "packages/server/api/**"
      - "packages/server/engine/**"
      - "packages/server/requirements.txt"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/server/api/**"
      - "packages/server/engine/**"
      - "packages/server/requirements.txt"
      - "tests/test_api_bootstrap.py"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-api-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    env:
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Test public API bootstrap through ASGI transport
        run: |
          python -m pip install -r requirements.txt pytest
          PYTHONPATH=.. python -m pytest ../../tests/test_api_bootstrap.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: api-production
    defaults:
      run:
        working-directory: packages/server
    env:
      VERCEL_ORG_ID: team_Uq6MeWzqk2HnlAbXDi5fuLBV
      VERCEL_PROJECT_ID: prj_7kdxZvwbxItXRjRTblmz2s0xFw3h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Vercel CLI
        run: npm install --global vercel@50.4.0
      - name: Pull production project environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod
      - name: Deploy reviewed API build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod
