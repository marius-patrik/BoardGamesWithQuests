name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/server/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-api-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build and verify installed server wheel (packaging only)
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt build
          python -m compileall -q api engine
          cd ../..
          python -m build --wheel --outdir dist .
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python - <<'PY'
          from importlib.resources import files
          from fastapi import FastAPI
          from server.api.index import app
          from server.auth import SupabaseAuth
          from server.engine.model.game.hooks import HookInterpreter
          from server.engine.model.game.conditions import ConditionEvaluator
          assert isinstance(app, FastAPI)
          for name in ('hooks', 'conditions', 'schema', 'snapshot_queries', 'outcomes'):
              assert files('server.engine.model.game').joinpath(name + '.py').is_file()
          print('Installed wheel imports and namespace resources available.')
          print('NOT VERIFIED: multiplayer gameplay, authentication and database behavior.')
          PY
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: api-production
    defaults:
      run:
        working-directory: packages/server
    env:
      VERCEL_ORG_ID: team_Uq6MeWzqk2HnlAbXDi5fuLBV
      VERCEL_PROJECT_ID: prj_7kdxZvwbxItXRjRTblmz2s0xFw3h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Vercel CLI
        run: npm install --global vercel@50.4.0
      - name: Pull production project environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Include canonical game configurations in API build
        run: cp -a ../../config config
      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod
      - name: Deploy reviewed API build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod
