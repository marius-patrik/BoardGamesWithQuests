name: Main Source Policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  main-source:
    name: main-source
    runs-on: ubuntu-latest
    steps:
      - name: Validate release promotion or exact upstream fork synchronization
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" != "main" ] ||
             [ "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Only a same-repository PR may target main"
            exit 1
          fi

          # One-time historical fork maintenance, NOT a production release promotion.
          # Both commit IDs, the upstream repository and the exact file delta are
          # checked against the GitHub API. No PR code is checked out or executed.
          if [ "$SOURCE_BRANCH" = "chore/479-sync-upstream-main" ]; then
            test "${HEAD_SHA:-}" = "3bc11ca3621ca5d497aff3bab071ac6d222dadcc"
            test "${BASE_SHA:-}" = "a98e36d098a1ee9aa3e793cfc39040ad6e6d2e4e"
            upstream="$(gh api repos/docekalgjkt/ChessWithQuests/branches/main --jq '.commit.sha')"
            test "$upstream" = "$HEAD_SHA"
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" |
              jq -e '.ahead_by == 1 and .behind_by == 0 and
                (.files | length) == 1 and
                .files[0].filename == "model/figurka.py"' >/dev/null
            echo "Exact upstream fork synchronization authorized for issue #479"
            exit 0
          fi

          if [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "::error::Only develop may promote releases to main"
            exit 1
          fi
