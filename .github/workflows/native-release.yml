name: Native Release Assets

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Resolve existing release at the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$tag" ]; then
            echo "No version tag points at this commit; no native release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - runner: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/native/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install native CLI, generate icons and set release version
        working-directory: packages/native
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          bun install
          bun run icon
          bun -e 'const p="src-tauri/tauri.conf.json"; const v=await Bun.file(p).json(); v.version=process.env.RELEASE_TAG.slice(1); await Bun.write(p, JSON.stringify(v,null,2)+"\n")'
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: packages/native
          tauriScript: bun tauri
          releaseId: ${{ needs.resolve.outputs.id }}
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  android:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Initialize mobile project, generate icons and match release version
        working-directory: packages/native
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          bun install
          bun run icon
          bun -e 'const p="src-tauri/tauri.conf.json"; const v=await Bun.file(p).json(); v.version=process.env.RELEASE_TAG.slice(1); await Bun.write(p, JSON.stringify(v,null,2)+"\n")'
          bun tauri android init --ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: packages/native
          tauriScript: bun tauri
          releaseId: ${{ needs.resolve.outputs.id }}
          mobile: android
          args: "--apk --target aarch64"
          uploadWorkflowArtifacts: true

  ios:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install iOS tools
        run: brew install cocoapods
      - name: Initialize iOS project and build unsigned simulator bundle
        working-directory: packages/native
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          bun install
          bun run icon
          bun -e 'const p="src-tauri/tauri.conf.json"; const v=await Bun.file(p).json(); v.version=process.env.RELEASE_TAG.slice(1); await Bun.write(p, JSON.stringify(v,null,2)+"\n")'
          bun tauri ios init --ci
          bun tauri ios build --ci --no-sign --target aarch64-sim
      - name: Package unsigned iOS simulator release asset
        id: simulator
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/boardgameswithquests-${TAG}-ios-simulator-unsigned.zip"
          cd packages/native/src-tauri/gen/apple/build
          zip -q -r "$output" .
          echo "path=$output" >> "$GITHUB_OUTPUT"
      - name: Attach clearly labeled simulator archive to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ steps.simulator.outputs.path }}
        run: gh release upload "$TAG" "$ASSET" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-unsigned-${{ needs.resolve.outputs.tag }}
          path: ${{ steps.simulator.outputs.path }}
          if-no-files-found: error
      # A distributable device IPA additionally requires Apple team signing,
      # provisioning profiles and an approved iOS distribution workflow.
