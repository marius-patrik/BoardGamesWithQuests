# One-shot review PR reopening workflow. Removed from the feature branch after successful creation.
name: Open reviewed architecture PR

on:
  push:
    branches:
      - spec/architecture-prd-reviewed
    paths:
      - .github/workflows/open-architecture-pr-once.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint DarkFactory GitHub App token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create bot-authored draft PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD" = "spec/architecture-prd-reviewed"
          gh api "repos/$GH_REPO/branches/$HEAD" --silent
          if [ -n "$(gh pr list --repo "$GH_REPO" --head "$HEAD" --base main --state open --json number --jq '.[0].number')" ]; then
            echo "A PR already exists for the reviewed architecture branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<'PRBODY'
          ## Purpose
          Replace #311 with a bot-authored PR that incorporates the maintainer's review.

          ## Review addressed
          - Move the Drizzle PostgreSQL schema and security routines into `.agents/SCHEMA.md`.
          - Move the complete Mermaid source/configuration AST into `.agents/AST.md`.
          - Keep `.agents/PRD.md` linked to both canonical documents, without embedded duplicates.
          - Synchronize the intended source tree and AST file nodes (148 declarations).

          ## Scope and verification
          Documentation/specification only: three files under `.agents/`.
          Cross-artifact structural and semantic checks passed for the four configuration documents, OpenAPI, and AST; 12 local regression tests passed. Full gameplay execution and PostgreSQL migration execution remain unverified.

          Replaces #311. Related: #295.
          PRBODY
          gh pr create --repo "$GH_REPO" --head "$HEAD" --base main --draft \
            --title 'docs(architecture): separate PRD, schema, and AST' \
            --body-file "$RUNNER_TEMP/pr-body.md" | tee -a "$GITHUB_STEP_SUMMARY"
