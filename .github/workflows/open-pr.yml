name: Open Pull Request

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Head branch"
        required: true
        type: string
      title:
        description: "PR title"
        required: true
        type: string
      body:
        description: "PR body, including linked issue"
        required: true
        type: string
      base:
        description: "Target branch"
        required: false
        default: development
        type: string
      draft:
        description: "Open as Draft"
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint DarkFactory installation token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create or update PR through authenticated GitHub API
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch || github.event.pull_request.head.ref }}
          BASE: ${{ inputs.base || github.event.pull_request.base.ref || 'development' }}
          TITLE: ${{ inputs.title || github.event.pull_request.title }}
          BODY: ${{ inputs.body || github.event.pull_request.body }}
          DRAFT: ${{ inputs.draft == true || github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          test -n "$BRANCH"
          test -n "$BASE"
          test -n "$TITLE"
          test -n "$BODY"
          gh api "repos/$GH_REPO/branches/$BRANCH" --silent
          gh api "repos/$GH_REPO/branches/$BASE" --silent
          existing=$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
            echo "Updated PR #$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          draft_flags=()
          if [ "$DRAFT" = true ]; then draft_flags=(--draft); fi
          gh pr create --repo "$GH_REPO" --head "$BRANCH" --base "$BASE" \
            --title "$TITLE" --body "$BODY" "${draft_flags[@]}"
