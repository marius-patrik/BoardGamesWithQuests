name: Reconcile Current Project Items
on:
  push:
    branches: [feature/product-integration]
    paths: [.github/workflows/sync-consolidated-project-items.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'marius-patrik/BoardGamesWithQuests'
    env:
      GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
    steps:
      - name: Ensure three active items appear in local and Global boards
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || exit 1
          for board in 14 17; do
            expected='BoardGamesWithQuests'
            [[ $board = 17 ]] && expected='Global'
            title="$(gh project view "$board" --owner marius-patrik --format json --jq '.title')"
            [[ "$title" = "$expected" ]] || exit 1
            for number in 129 239 271; do
              url="https://github.com/marius-patrik/BoardGamesWithQuests/issues/$number"
              [[ "$number" = 271 ]] && url="https://github.com/marius-patrik/BoardGamesWithQuests/pull/$number"
              existing="$(gh project item-list "$board" --owner marius-patrik --limit 1000 --format json | jq -r --arg url "$url" '[.items[]|select(.content.url == $url)|.id][0] // empty')"
              if [[ -n "$existing" ]]; then
                echo "Present: board $board item $number"
              else
                gh project item-add "$board" --owner marius-patrik --url "$url" --format json | jq '{id,title}'
              fi
            done
          done
