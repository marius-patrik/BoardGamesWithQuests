          fix/the-records-against-the-diagram|cae73572c426c3f461cee06e2364b5a344701910
          fix/the-settings-dialog-affects-the-game|399dee3f0f267b0fd4f077b134335d0733974e7d
          fix/three-defects-found-in-review|174b0d76bd3ff0173abeeed4a93f8ee7adc153d3
