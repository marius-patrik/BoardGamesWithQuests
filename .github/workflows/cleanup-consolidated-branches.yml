name: One-time consolidated PR branch cleanup
on:
  push:
    branches: [feature/product-integration]
    paths: [.github/workflows/cleanup-consolidated-branches.yml]
permissions:
  contents: write
jobs:
  delete-verified-superseded-refs:
    if: github.repository == 'marius-patrik/BoardGamesWithQuests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Delete only exact, fully-absorbed historical heads
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Historical PRs have been closed unmerged. All their tips were checked
          # as ancestors of the new two-parent consolidation commit before this run.
          # Rerun exact SHA and ancestry checks here to prevent race-induced deletion.
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            case "$branch" in main|gh-pages|feature/product-integration) exit 1;; esac
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' || true)"
            if [[ -z "$actual" ]]; then
              echo "Already removed: $branch"
              continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Ref moved since approval: $branch expected $expected got $actual"
              exit 1
            fi
            if ! git cat-file -e "$expected^{commit}" || ! git merge-base --is-ancestor "$expected" HEAD; then
              echo "::error::Historical SHA not reachable from consolidated HEAD: $branch"
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted preserved historical ref: $branch"
          done <<'REFS'
          chore/remove-agent-workflows|773ab1605dd418f28a6fa5210dedc414c1925072
          docs/close-the-divergences-the-review-found|8d9770b37573c6dcd0d5f49fc80862b09a0593f9
          docs/the-records-against-the-code|f8db6792289b49d627ba04f9ede7fd8c0130998a
          feat/a-written-rule-joins-the-ruleset|c5d5ceb7a53c0ee035f5790989fdf0aa5a0267fb
          feat/checkers-letter-and-header|f54f335a3ff43954b1fb9aa8b9f1ccbed7ae73fb
          feat/compose-every-section-from-its-directory|5101d11d915177ca2a16ed88e2341cce129f30b8
          feat/the-formats-the-diagram-draws|5dfe3f54b186e5fe137dffd41994c8fc34498d3e
          feat/the-formats-write-what-they-claim|a272c51ee6cd14c62a13e8adec2034ef5b778a7e
          feature/board-generalisation|3d104331588f0c9191384a9efd8b426a530f6235
          feature/chess-configuration|66f9ec0fecd2eee3ca91e050f97f7a863ad90caa
          feature/chess-rules|b9e8e0fbf71880764693edd82e376b5bebc4cc18
          feature/game-view|d7c0346d79eb52db59ea39de013ad865451defb0
          feature/quest-hierarchy|063afff9b280a4d1005bb922c77f0938c3a9930d
          feature/rule-layer|1beff3a37f21e06aafe3b7397e34c9fa0fbaf4d9
          feature/wire-game-loop|4291e3a5cedd990b5dbb77715288da80f277f984
          fix/announce-why-a-game-ended|3e62e883c0d31b903e4cba72d101facaf4d65e1f
          fix/checkers-wcdf-rules|fccd84fd6f66574c3be9b9f409559c2067a5ed0d
          fix/chess-on-boards-wider-than-eight|b3115c75a5f2aed40e5bc2758f8e20694656a304
          fix/close-the-engine-residual-limitations|72b11fc831e3644e2b5a0fc06e6637fd2a7929a7
