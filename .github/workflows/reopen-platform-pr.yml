name: Reopen Platform PR via DarkFactory App
on:
  push:
    branches:
      - feat/server-web-native-bootstrap
    paths:
      - .github/workflows/reopen-platform-pr.yml
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - name: Mint bot installation token
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Recreate stacked PR as GitHub App and carry forward reviewer feedback
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: feat/server-web-native-bootstrap
          BASE_BRANCH: spec/architecture-prd-reviewed
          ORIGINAL_PR: "302"
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # An installation token is used, never the maintainer or workflow default token.
          test "$(gh api "repos/$GH_REPO/pulls/$ORIGINAL_PR" --jq .state)" = closed
          existing="$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "An open PR already exists for $HEAD_BRANCH: #$existing" >&2
            exit 1
          fi
          title="$(gh api "repos/$GH_REPO/pulls/$ORIGINAL_PR" --jq .title)"
          body="$(gh api "repos/$GH_REPO/pulls/$ORIGINAL_PR" --jq '.body // ""')"
          printf -v body '%s\n\n%s' "$body" "Replaces #302 as a bot-authored stacked PR. Review references and the latest four inline comments are carried forward from #302; #331 is the direct dependency."
          url="$(gh pr create --repo "$GH_REPO" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --draft --title "$title" --body "$body")"
          number="${url##*/}"
          test "$number" -gt 302
          echo "GitHub App-created PR: $url" >> "$GITHUB_STEP_SUMMARY"

          # GitHub does not migrate review objects between PRs. Reproduce each
          # recent instruction as an actionable inline comment at its live path.
          for id in 4302614444 4302616602 4302619289 4302622335; do
            original="$(gh api "repos/$GH_REPO/pulls/comments/$id")"
            comment_path="$(jq -r .path <<<"$original")"
            comment_body="$(jq -r .body <<<"$original")"
            comment_url="$(jq -r .html_url <<<"$original")"
            printf -v comment 'Carried forward verbatim from @marius-patrik on #302:\n\n> %s\n\nOriginal: %s' "$comment_body" "$comment_url"
            gh api "repos/$GH_REPO/pulls/$number/comments" -X POST \
              -f body="$comment" -f commit_id="$HEAD_SHA" \
              -f path="$comment_path" -F line=1 -f side=RIGHT --silent
          done

          # Preserve earlier reviewer requests, paths and original permanent URLs.
          # Their resolved review discussions remain available in the former PR.
          historical="$(gh api "repos/$GH_REPO/pulls/$ORIGINAL_PR/comments?per_page=100" --paginate --jq '.[] | select(.user.login == "marius-patrik" and (.in_reply_to_id == null) and (.id != 4302614444 and .id != 4302616602 and .id != 4302619289 and .id != 4302622335)) | "- [" + .path + "](" + .html_url + "): " + .body')"
          review_link="https://github.com/$GH_REPO/pull/$ORIGINAL_PR#pullrequestreview-5557046520"
          printf -v carry '## Review feedback transferred from #302\n\nGitHub does not allow review comments to be moved as original comment objects. These are the original reviewer instructions and links; all recent actionable comments were also recreated inline above.\n\n%s\n\n- [Review-level instruction: rename web to client and recreate as bot-authored](%s)\n\nOriginal review discussions remain at #302.' "$historical" "$review_link"
          gh api "repos/$GH_REPO/issues/$number/comments" -X POST -f body="$carry" --silent
          echo "Reproduced four inline review comments and preserved earlier reviewer feedback." >> "$GITHUB_STEP_SUMMARY"
