name: Build Main Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# A failed production build does not block separately built PR documentation.
permissions:
  contents: write

concurrency:
  group: docs-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify staged publication behavior
        run: python -m pytest -q .github/tests/test_docs_publication.py

      - name: Build and validate main
        run: |
          python .github/scripts/build_docs.py
          test -f site/index.html

      - name: Cache successful main build without changing PR snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --depth 1 --branch gh-pages \
            "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/docs-staging"
          git -C "$RUNNER_TEMP/docs-staging" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/docs-staging" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rsync -a --delete --exclude='.git/' --exclude='pr-*/' \
            --exclude='branch/' site/ "$RUNNER_TEMP/docs-staging/"
          git -C "$RUNNER_TEMP/docs-staging" add -A
          if ! git -C "$RUNNER_TEMP/docs-staging" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/docs-staging" commit -m "docs(pages): cache passing main site"
            git -C "$RUNNER_TEMP/docs-staging" push origin HEAD:gh-pages
          fi
