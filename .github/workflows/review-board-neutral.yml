name: Verify Game-Neutral Board (Temporary)

on:
  push:
    branches: [feature/board-generalisation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real package
        run: python -m pip install -e .
      - name: Verify game-owned setup, geometry and honest exporter interface
        run: |
          python - <<'PY'
          import inspect

          from chess import __name__ as chess_module
          from engine.model.game.board import Board
          from engine.model.game.configuration import (
              board_from_definition,
              load_definition,
          )
          from engine.model.game.move import Move
          from engine.model.game.validator import MoveValidator
          from engine.model.misc.export_writers import ExportWriter
          from engine.model.pieces.piece import Piece
          from engine.model.pieces.rook import Rook
          from engine.model.pieces.pawn import Pawn

          def rejects(fn, error):
              try:
                  fn()
              except error:
                  return
              raise AssertionError(f"Expected {error.__name__}: {fn}")

          # A board is a game-neutral storage container; no chess position baked in.
          for dimensions in ((8, 8), (5, 7), (10, 10)):
              board = Board(dimensions)
              assert all(board.get_piece_at((r, c)) is None for r in range(board.rows) for c in range(board.cols))
          rejects(lambda: Board((10, 0)), ValueError)
          assert not hasattr(Board, "setup_default_board")
          assert not hasattr(Board, "default_placement")
          assert "setup_pieces" not in inspect.signature(Board).parameters

          # JSON declarations, not the engine, own every game's starting pieces.
          chess = load_definition("chess")
          checkers = load_definition("checkers")
          assert chess.exports == ()
          assert checkers.exports == ()
          board = board_from_definition(chess)
          assert (board.rows, board.cols) == (8, 8)
          assert board.get_piece_at((0, 0)).getType() == "rook"
          assert board.get_piece_at((0, 0)).getColor() == -1
          assert board.get_piece_at((7, 0)).getColor() == 1
          assert board.get_piece_at((7, 4)).isRoyal()
          assert board.get_piece_at((0, 4)).isRoyal()
          assert board.get_piece_at((1, 0)).getDirections() == [(1, 0)]
          assert board.get_piece_at((6, 0)).getDirections() == [(-1, 0)]
          assert (5, 0) in MoveValidator(board).get_pseudo_legal_moves((6, 0))
          assert (2, 2) in MoveValidator(board).get_pseudo_legal_moves((0, 1))
          draughts = board_from_definition(checkers)
          assert sum(p is not None for row in draughts.board for p in row) == 24
          assert MoveValidator(draughts).find_royal(1) is None
          assert not MoveValidator(draughts).is_stalemate(1)

          # Board dimensions, captures, repeat, jumping and blocked initial moves.
          large = Board((10, 10), placement=[((0, 9), Rook(1))])
          val = MoveValidator(large)
          assert (9, 9) in val.get_pseudo_legal_moves((0, 9))
          assert (0, 0) in val.get_pseudo_legal_moves((0, 9))
          assert val.is_valid_move(Move((0, 9), (0, 0)), large)
          assert not Move((0, 9), (10, 0)).execute(large)
          assert large.get_piece_at((0, 9)) is not None
          rejects(lambda: large.apply_placement([((9, 9), Rook(1)), ((9, 9), Rook(-1))]), ValueError)
          assert large.get_piece_at((0, 9)) is not None
          rejects(lambda: large.set_piece_at((10, 0), Rook(1)), IndexError)
          assert not large.move_piece((0, 9), (0, 9))

          pawn = Pawn(1)
          origin = (0, 0)
          small = Board((5, 7), placement=[(origin, pawn), ((1, 0), Rook(-1))])
          assert (2, 0) not in MoveValidator(small).get_pseudo_legal_moves(origin)
          small.set_piece_at((1, 0), None)
          assert (2, 0) in MoveValidator(small).get_pseudo_legal_moves(origin)

          # Engine cannot pretend to export incomplete PGN, SAN, FEN or draughts.
          assert inspect.isabstract(ExportWriter)
          rejects(ExportWriter, TypeError)
          try:
              from engine.model.misc.export_writers import ChessNotationWriter
          except ImportError:
              pass
          else:
              raise AssertionError("ChessNotationWriter must not remain in generic engine")

          print("Temporary 5x7/8x8/10x10 game boundary verification passed.")
          PY
