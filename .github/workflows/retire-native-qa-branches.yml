name: Retire Verified Native QA Branches

on:
  push:
    branches: [v1]

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    if: "${{ github.event.head_commit.message == 'chore(qa): retire verified native acceptance branches' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Preserve exact source commits as archive tags before branch deletion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$repo" = 'marius-patrik/BoardGamesWithQuests'
          current=$(gh api "repos/$repo/git/ref/heads/v1" --jq '.object.sha')
          tree=$(gh api "repos/$repo/git/trees/$current?recursive=1")
          verify_blob() {
            local path="$1" expected="$2" observed
            observed=$(jq -r --arg p "$path" '.tree[] | select(.path == $p) | .sha' <<< "$tree")
            if [ "$observed" != "$expected" ]; then
              echo "::error::Required native QA blob not integrated: $path ($observed != $expected)"
              exit 1
            fi
          }
          verify_blob '.github/tests/frozen_native_acceptance.py' '7fe41d0bd9c601021ac0a6002e0e402816cef122'
          verify_blob '.github/scripts/package_desktop.py' '0ad341e92c6cc3fa11e5893fd398f361b4e784bf'
          verify_blob '.github/workflows/desktop-build.yml' '4c58ae1434693a8d5ea31a86578527bc527cbf13'
          verify_blob '.github/workflows/desktop-native-acceptance.yml' '927940513bd7c65b1c9563eaff36596df86bce1c'

          branches=(
            'qa/443-frozen-native-acceptance:1ab666fe191098af2e58796cef4d5f5a1846b296'
            'qa/443-n1b-macos-recovery:3d119f4767db06c9d0d814522044436f49dd42d7'
            'qa/443-final-data-acceptance:1e49fa588732a8ec307cc8332272b27398ed7b2a'
          )
          open_pr_heads=$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "marius-patrik/BoardGamesWithQuests") | .head.ref')
          for entry in "${branches[@]}"; do
            branch="${entry%%:*}"
            sha="${entry#*:}"
            if grep -Fxq "$branch" <<< "$open_pr_heads"; then
              echo "::error::Open PR depends on $branch"
              exit 1
            fi
            actual=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')
            if [ "$actual" != "$sha" ]; then
              echo "::error::Branch $branch changed ($actual != $sha); refusing deletion"
              exit 1
            fi
          done

          # Archive tags preserve every original commit before removing any branch.
          for entry in "${branches[@]}"; do
            branch="${entry%%:*}"
            sha="${entry#*:}"
            tag="archive/native-qa/${branch#qa/}-${sha:0:12}"
            if existing=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              if [ "$existing" != "$sha" ]; then
                echo "::error::Existing archive tag $tag disagrees with $sha"
                exit 1
              fi
            else
              gh api --method POST "repos/$repo/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            preserved=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')
            if [ "$preserved" != "$sha" ]; then
              echo "::error::Failed to preserve commit $sha as $tag"
              exit 1
            fi
            echo "Preserved $branch at $sha as refs/tags/$tag"
          done

          # Re-check PR dependencies and exact branch SHAs immediately before deletion.
          open_pr_heads=$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "marius-patrik/BoardGamesWithQuests") | .head.ref')
          for entry in "${branches[@]}"; do
            branch="${entry%%:*}"
            sha="${entry#*:}"
            if grep -Fxq "$branch" <<< "$open_pr_heads"; then
              echo "::error::New PR dependency for $branch; preserving branch"
              exit 1
            fi
            actual=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')
            if [ "$actual" != "$sha" ]; then
              echo "::error::Branch $branch changed before deletion; preserving branch"
              exit 1
            fi
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            echo "Retired $branch at $sha; full commit history retained by archive tag"
          done
