name: Run Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  invoke:
    uses: marius-patrik/DarkFactory/.github/workflows/agent.yml@368eb9d75d5d828e7ac17fe590d4dc17b028cebc
    with:
      pipeline-ref: "368eb9d75d5d828e7ac17fe590d4dc17b028cebc"
      pipeline-repo: marius-patrik/DarkFactory
      agent-enabled: ${{ vars.AGENT_ENABLED }}
    secrets:
      DARKFACTORY_APP_PRIVATE_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DF_ACCOUNT_OPENAI_CODEX: ${{ secrets.DF_ACCOUNT_OPENAI_CODEX }}
      DF_ACCOUNT_GROK_SUB: ${{ secrets.DF_ACCOUNT_GROK_SUB }}
