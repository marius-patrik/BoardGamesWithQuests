site_name: BoardGamesWithQuests
site_description: JSON-configurable Python chess/checkers engine, React web app, Supabase and generated source documentation
site_author: marius-patrik
repo_name: marius-patrik/BoardGamesWithQuests
repo_url: https://github.com/marius-patrik/BoardGamesWithQuests

# Pages and navigation are generated from tracked Python source docstrings.
# The existing theme asset directory permits the direct strict CLI; the hook
# replaces collected files with source-generated pages and explicit assets.
docs_dir: .github/docs-ui

theme:
  name: material
  custom_dir: .github/docs-ui

extra_css:
  - assets/theme.css
extra_javascript:
  - assets/theme.js
extra: {}

hooks:
  - .github/scripts/docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 2-4

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: []
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            heading_level: 3
